<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Ledger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0c0a;--surface:#161612;--surface2:#1e1e19;--border:#2a2a22;
  --text:#e4e2d6;--muted:#6b6958;--accent:#d4a843;--green:#6b9e78;--red:#b85c4a;
  --blue:#5a7eb8;--orange:#c8724a;
  --font:'DM Mono',Consolas,Monaco,monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;min-height:100vh}
#app{max-width:1120px;margin:0 auto;padding:20px}

/* HEADER */
#hdr{display:flex;align-items:center;gap:16px;margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border)}
#hdr h1{font-size:18px;font-weight:400;color:var(--accent);letter-spacing:.02em}
#hdr-stats{display:flex;gap:20px;margin-left:auto}
.hstat{font-size:11px;color:var(--muted)}.hstat b{color:var(--text);font-weight:400}

/* TABS */
#tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid var(--border)}
.tab{padding:8px 18px;font-family:var(--font);font-size:12px;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:.15s}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab:hover:not(.on){color:var(--text)}

/* UPLOAD AREA */
#upload-area{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.upbox{border:1px dashed var(--border);border-radius:6px;padding:20px;text-align:center;cursor:pointer;transition:.2s}
.upbox:hover,.upbox.drag{border-color:var(--accent)}
.upbox .ico{font-size:22px;margin-bottom:6px}
.upbox .lbl{font-size:13px;margin-bottom:3px}
.upbox .hint{font-size:10px;color:var(--muted);line-height:1.6}

/* STATUS */
#status{display:none;padding:9px 12px;border-radius:5px;margin-bottom:10px;font-size:12px}
.s-load{background:var(--surface);border:1px solid var(--border);color:var(--accent)}
.s-ok{background:rgba(107,158,120,.1);border:1px solid rgba(107,158,120,.3);color:var(--green)}
.s-err{background:rgba(184,92,74,.1);border:1px solid rgba(184,92,74,.3);color:var(--red)}

/* DATA PANEL */
#data-panel{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:11px 14px;margin-bottom:12px}
.dp-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.dp-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.dp-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{font-size:10px;border:1px solid var(--border);border-radius:20px;padding:3px 8px;color:var(--green)}
.sbtn{font-family:var(--font);font-size:11px;background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:4px 9px;border-radius:4px;cursor:pointer}
.sbtn:hover{border-color:var(--accent);color:var(--accent)}
.sbtn.danger{color:var(--red)}.sbtn.danger:hover{border-color:var(--red)}
.file-log{display:grid;gap:5px}
.frow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:5px;padding:7px 10px}
.fname{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta{font-size:10px;color:var(--muted)}
.fstat{font-size:10px;color:var(--green)}
.fstat.fail{color:var(--red)}
.fempty{font-size:11px;color:var(--muted);padding:6px 2px}

/* ADD ROW */
#add-row{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:12px}
#add-row .fld label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
#add-row input,#add-row select{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:12px;padding:4px 7px;border-radius:4px}
.abtn{background:var(--accent);color:#0c0c0a;border:none;padding:5px 14px;border-radius:4px;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:700}

/* FILTERS */
.filter-row{display:flex;gap:7px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.filter-row select,.filter-row input{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:12px;padding:5px 8px;border-radius:4px}

/* TABLE */
.tx-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
thead th{text-align:left;padding:5px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--border);font-weight:400}
tbody tr{border-bottom:1px solid #131310}
tbody tr:hover td{background:#111110}
tbody td{padding:6px 8px;vertical-align:middle}
.dc{font-size:11px;color:var(--muted);white-space:nowrap}
.dtag{display:block;font-size:9px;color:var(--accent)}
.desc-c{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci{display:flex;align-items:center;gap:5px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;flex-shrink:0}
.csel{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:11px;padding:2px 5px;border-radius:3px;max-width:200px;cursor:pointer}
.csel.unc{border-color:rgba(184,92,74,.5);color:var(--red)}
.tsel{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:11px;padding:2px 5px;border-radius:3px;max-width:130px;cursor:pointer}
.amt{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.exp{color:var(--red)}.amt.cred{color:var(--green)}
.ibtn{background:none;border:1px solid var(--border);color:var(--muted);font-size:10px;padding:2px 6px;border-radius:3px;cursor:pointer;font-family:var(--font)}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.dbtn{background:none;border:none;color:#2a2a22;cursor:pointer;font-size:15px;line-height:1;padding:0 3px}
.dbtn:hover{color:var(--red)}
.banner{padding:7px 10px;border-radius:4px;margin-bottom:7px;font-size:11px;background:rgba(184,92,74,.1);border:1px solid rgba(184,92,74,.3);color:var(--red)}
.empty{text-align:center;padding:48px;color:var(--muted)}
.empty .eb{font-size:15px;margin-bottom:7px;color:var(--text)}

/* MONTHLY */
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:6px;margin-bottom:10px;overflow:hidden}
.mhdr{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.mtitle{font-size:15px}.mtotal{color:var(--accent);font-variant-numeric:tabular-nums}
.mbody{padding:9px 14px}
.crow{display:flex;align-items:center;gap:9px;padding:4px 0;border-bottom:1px solid #0f0f0c}
.crow:last-child{border:none}
.cname{font-size:11px;color:var(--muted);width:200px;flex-shrink:0}
.bwrap{flex:1;height:3px;background:var(--border);border-radius:2px}
.bar{height:3px;border-radius:2px;opacity:.85;transition:width .3s}
.cpct{font-size:10px;color:var(--muted);width:32px;text-align:right;flex-shrink:0}
.camt{font-size:12px;font-variant-numeric:tabular-nums;min-width:68px;text-align:right}

/* YEARLY */
.yr-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.ycard{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px 16px}
.ycard .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
.ycard .val{font-size:22px;font-variant-numeric:tabular-nums}.ycard .val.gold{color:var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.mcell{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:9px 11px}
.mcell .ml{font-size:10px;color:var(--muted);margin-bottom:2px}
.mcell .mv{font-size:13px;font-variant-numeric:tabular-nums}
.yrcats{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:14px}
.yrcats h3{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.ycrow{display:flex;align-items:center;gap:9px;padding:5px 0;border-bottom:1px solid #0f0f0c}
.ycrow:last-child{border:none}
.ycname{font-size:12px;width:200px;flex-shrink:0}
.ybwrap{flex:1;height:4px;background:var(--border);border-radius:2px}
.ybar{height:4px;border-radius:2px;opacity:.85}
.ypct{font-size:11px;color:var(--muted);width:36px;text-align:right;flex-shrink:0}
.yamt{font-size:13px;font-variant-numeric:tabular-nums;min-width:72px;text-align:right;font-weight:500}

/* TRIPS */
.trips-grid{display:grid;gap:10px}
.tcard{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.tcard-hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.tcard-name{font-size:15px;color:var(--accent)}
.tcard-meta{font-size:11px;color:var(--muted);margin-top:2px}
.tcard-total{font-size:18px;font-variant-numeric:tabular-nums}
.tcard-body{padding:10px 14px}
.no-trips{text-align:center;padding:48px;color:var(--muted)}
.no-trips .nb{font-size:14px;color:var(--text);margin-bottom:6px}

/* MODAL */
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center}
#modal.open{display:flex}
#mbox{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:22px;min-width:280px}
#mbox h3{font-size:14px;color:var(--accent);margin-bottom:5px}
#mdesc{font-size:11px;color:var(--muted);margin-bottom:12px}
#mbox select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:13px;padding:6px;border-radius:4px;margin-bottom:14px}
.mbtns{display:flex;gap:7px;justify-content:flex-end}
.mcancel{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 13px;border-radius:4px;cursor:pointer;font-family:var(--font);font-size:12px}
.mok{background:var(--accent);border:none;color:#0c0c0a;padding:5px 14px;border-radius:4px;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:700}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <h1>Expense Ledger</h1>
    <div id="hdr-stats">
      <div class="hstat">transactions <b id="sc">0</b></div>
      <div class="hstat">matched <b id="sm" style="color:var(--green)">0%</b></div>
      <div class="hstat">total spend <b id="st">—</b></div>
    </div>
  </div>
  <div id="tabs">
    <button class="tab on" onclick="showTab('tx')">Transactions</button>
    <button class="tab" onclick="showTab('mo')">Monthly</button>
    <button class="tab" onclick="showTab('yr')">Yearly</button>
    <button class="tab" onclick="showTab('tr')">Trips</button>
  </div>

  <!-- TRANSACTIONS TAB -->
  <div id="tab-tx">
    <div id="upload-area">
      <div class="upbox" onclick="document.getElementById('fi-pdf').click()"
        ondragover="ev.preventDefault();this.classList.add('drag')"
        ondragleave="this.classList.remove('drag')" ondrop="drop(event,'pdf')">
        <input id="fi-pdf" type="file" accept=".pdf" multiple style="display:none" onchange="handleFiles(this.files,'pdf')">
        <div class="ico">📄</div>
        <div class="lbl">Upload PDF</div>
        <div class="hint">AMEX · Capital One · Chase · OCBC<br>Auto-detected, auto-categorized</div>
      </div>
      <div class="upbox" onclick="document.getElementById('fi-csv').click()"
        ondragover="event.preventDefault();this.classList.add('drag')"
        ondragleave="this.classList.remove('drag')" ondrop="drop(event,'csv')">
        <input id="fi-csv" type="file" accept=".csv" multiple style="display:none" onchange="handleFiles(this.files,'csv')">
        <div class="ico">📊</div>
        <div class="lbl">Upload CSV</div>
        <div class="hint">Any card export<br>Most reliable format</div>
      </div>
    </div>

    <div id="status"></div>

    <div id="data-panel">
      <div class="dp-head">
        <div>
          <div class="dp-title">Saved data</div>
          <div class="fmeta" style="margin-top:2px">Autosaves to this browser. All uploads accumulate.</div>
        </div>
        <div class="dp-actions">
          <span class="pill" id="save-pill">autosave on</span>
          <button class="sbtn" onclick="exportBackup()">Export backup</button>
          <button class="sbtn" onclick="document.getElementById('bi').click()">Import backup</button>
          <button class="sbtn danger" onclick="clearAll()">Clear all</button>
          <input id="bi" type="file" accept=".json" style="display:none" onchange="importBackup(this.files)">
        </div>
      </div>
      <div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px">Uploaded files</div>
      <div class="file-log" id="file-log"></div>
    </div>

    <div id="add-row">
      <div class="fld"><label>Date</label><input type="date" id="m-date"></div>
      <div class="fld"><label>Description</label><input type="text" id="m-desc" placeholder="Merchant" style="width:150px"></div>
      <div class="fld"><label>Amount</label><input type="number" id="m-amt" placeholder="0.00" step="0.01" style="width:82px"></div>
      <div class="fld"><label>Card</label>
        <select id="m-card"><option>AMEX</option><option>Capital One</option><option>Chase</option><option>OCBC</option><option>Manual</option></select>
      </div>
      <div class="fld"><label>Category</label><select id="m-cat"></select></div>
      <button class="abtn" onclick="addManual()">+ Add</button>
    </div>

    <div class="filter-row">
      <input id="f-search" placeholder="Search..." oninput="renderTx()" style="width:150px">
      <select id="f-cat" onchange="renderTx()"><option value="">All categories</option></select>
      <select id="f-month" onchange="renderTx()"><option value="">All months</option></select>
      <select id="f-card" onchange="renderTx()"><option value="">All cards</option></select>
      <select id="f-trip" onchange="renderTx()"><option value="">All trips</option></select>
      <label style="font-size:11px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:5px">
        <input type="checkbox" id="f-hc" onchange="renderTx()"> Hide credits
      </label>
    </div>
    <div id="tx-list"></div>
  </div>

  <div id="tab-mo" style="display:none"></div>
  <div id="tab-yr" style="display:none"></div>
  <div id="tab-tr" style="display:none"></div>
</div>

<div id="modal">
  <div id="mbox">
    <h3 id="mtitle">Move to month</h3>
    <div id="mdesc"></div>
    <select id="msel"></select>
    <div class="mbtns">
      <button class="mcancel" onclick="closeModal()">Cancel</button>
      <button class="mok" id="mok" onclick="confirmModal()">OK</button>
    </div>
  </div>
</div>

<script>
// ── CATEGORIES ─────────────────────────────────────────────────────────────
const CATS=['Food & Dining','Groceries','Fitness & Health','Shopping',
  'Travel & Transport','Entertainment & Subscriptions','Home & Utilities',
  'Medical & Beauty','Savings & Investments','Transfers & Payments',
  'Fees & Interest','Uncategorized'];
const CM={
  'Food & Dining':{e:'🍽️',c:'#c28e6a'},'Groceries':{e:'🛒',c:'#9ec27a'},

  'Travel & Transport':{e:'✈️',c:'#6a8ec2'},'Entertainment & Subscriptions':{e:'🎬',c:'#9a7ac2'},
  'Home & Utilities':{e:'🏠',c:'#8e9ec2'},'Medical & Beauty':{e:'🏥',c:'#c27a8e'},
  'Savings & Investments':{e:'💰',c:'#7ac28e'},'Transfers & Payments':{e:'↔️',c:'#7a8e7a'},
  'Fees & Interest':{e:'🏦',c:'#9a9a7a'},'Uncategorized':{e:'❓',c:'#4a4a40'}

const cc=c=>(CM[c]||{c:'#6b6958'}).c;
const ce=c=>(CM[c]||{e:'•'}).e;

// ── MERCHANT RULES ─────────────────────────────────────────────────────────
const RULES=[

  {k:['marriott','hilton','hyatt','westin','sheraton','four seasons','ritz carlton','holiday inn',
      'airbnb','vrbo','booking.com','amex fine hotels','hotel eve','htl century','yell old faith'],c:'Travel & Transport'},
  {k:['cotai ferry','ferry company'],c:'Travel & Transport'},
  {k:['uber eats','ubereats'],c:'Food & Dining'},
  {k:['uber trip','uber   *trip'],c:'Travel & Transport'},
  {k:['uber'],c:'Travel & Transport'},
  {k:['grab*','grab ','ventra','mobile pasmo','suica','bus/mrt','narita airpor','klook travel'],c:'Travel & Transport'},
  {k:['trader joe','whole foods','jewel-osco','weee inc','marianos','cold storage','h mart',
      'fruits vendin','rancho gordo','mick klug','schoolhouse fish','sitkaseafoodmarket',
      'all grass farms','tomato mountain','instacart','freshdirect','amazon fresh','shipt',
      'sp rancho gordo','b2d* mick klug','sp all grass','sp sitka'],c:'Groceries'},
  {k:['tst*'],c:'Food & Dining'},
  {k:['deliveroo','food panda','doordash','grubhub','seamless','postmates'],c:'Food & Dining'},
  {k:['blendin coffee','sawada coffee','blue bottle','starbucks','dollop coffee','syipcafe',
      'tanamera','sarutahiko','kurasu','vesta coffee','o3coffee','6oz espresso'],c:'Food & Dining'},

      'lung fung','humble origin','finest@','weera thai','demachi','jiao feng','the otherside',

      'sip society','monteverde','omg tea','rich & good'],c:'Food & Dining'},

  {k:['classpass','union padel','westsuburbanspecialrecrea','westsuburban','all community events',
      'all community','alpine valley','diplos run club','evolve st'],c:'Fitness & Health'},
  {k:['equinox','soulcycle','peloton','orangetheory','planet fitness','ymca','f45','solidcore','pure barre'],c:'Fitness & Health'},

  {k:['nordstrom'],c:'Shopping'},{k:['aritzia'],c:'Shopping'},
  {k:['bombas','shop.bombas'],c:'Shopping'},{k:['brooklinen'],c:'Shopping'},
  {k:['design gallery'],c:'Shopping'},{k:['taobao'],c:'Shopping'},
  {k:['fgt*lolla','lolla tix','lollapalooza'],c:'Entertainment & Subscriptions'},
  {k:['amazon','amzn'],c:'Shopping'},{k:['target'],c:'Shopping'},
  {k:['macys','barneys','tjmaxx','tj maxx','marshalls','zara','h&m','uniqlo','lovebonito',

      'pokemon','rei.com','velox digital','saks','sephora','nm online','neiman marcus'],c:'Shopping'},
  {k:['openai','chatgpt'],c:'Entertainment & Subscriptions'},
  {k:['google *youtube','youtubepremium','youtube premium','google *youtubepremi'],c:'Entertainment & Subscriptions'},
  {k:['apple.com/bill'],c:'Entertainment & Subscriptions'},
  {k:['netflix','hulu','disney+','hbo max','spotify','peacock','paramount+','audible','kindle unlimited'],c:'Entertainment & Subscriptions'},
  {k:['coinhako','coinbase','kraken','binance','crypto','fidelity','vanguard','schwab','robinhood','etrade'],c:'Savings & Investments'},
  {k:['coned','verizon','at&t','t-mobile','comcast','xfinity','spectrum','home depot','lowes'],c:'Home & Utilities'},

function categorize(desc){
  const d=desc.toLowerCase();
  for(const r of RULES)for(const k of r.k)if(d.includes(k))return r.c;
  return'Uncategorized';
}

// ── HELPERS ────────────────────────────────────────────────────────────────
const MOS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MO_MAP={Jan:'01',Feb:'02',Mar:'03',Apr:'04',May:'05',Jun:'06',Jul:'07',Aug:'08',Sep:'09',Oct:'10',Nov:'11',Dec:'12'};
const CARD_C={'AMEX':'#5a7eb8','Capital One':'#b85c4a','Chase':'#6b9e78','OCBC':'#c8724a','Manual':'#9e7a7e'};
const fm=n=>'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const mk=d=>d?d.slice(0,7):'';
const ml=k=>{if(!k)return'';const[y,m]=k.split('-');return MOS[+m-1]+' '+y;};
const fd=d=>{if(!d)return'';const[y,m,dy]=d.split('-');return MOS[+m-1]+' '+parseInt(dy)+', '+y;};
const uid=()=>Math.random().toString(36).slice(2);
const pct=(a,b)=>b>0?Math.round(a/b*100):0;

function nd(s){
  if(!s)return null;s=s.trim();
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m)return`${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  return null;
}

function makeTx(date,desc,amount,card,isCredit){
  const clean=desc.replace(/\s+/g,' ').replace(/[^\x20-\x7E\u4e00-\u9fff]/g,'').trim();
  return{id:uid(),date,expenseDate:date,desc:clean,amount,card,
    category:isCredit?'Transfers & Payments':categorize(clean),
    trip:'',moved:false,isCredit};
}
function dedup(arr){
  const s=new Set();
  return arr.filter(t=>{const k=`${t.date}|${Math.abs(t.amount).toFixed(2)}|${t.desc.slice(0,14).toLowerCase()}`;if(s.has(k))return false;s.add(k);return true;});
}

let txns=[],uploadedFiles=[],moveId=null,modalMode='month';
const SK='expenseLedger.v4';

// ── PDF.JS LOADER (multi-CDN) ──────────────────────────────────────────────
async function loadPDFJS(){
  if(window.pdfjsLib)return true;
  const cdns=[
    ['https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js','https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js'],
    ['https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'],
    ['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'],
  ];
  for(const[lib,worker]of cdns){
    try{
      await new Promise((res,rej)=>{
        if(window.pdfjsLib){res();return;}
        const s=document.createElement('script');
        s.src=lib;s.onload=()=>{if(window.pdfjsLib)window.pdfjsLib.GlobalWorkerOptions.workerSrc=worker;res();};
        s.onerror=rej;document.head.appendChild(s);
      });
      if(window.pdfjsLib)return true;
    }catch(e){continue;}
  }
  return false;
}

async function pdfToText(file){
  const ok=await loadPDFJS();
  if(!ok)throw new Error('PDF library failed to load. Please check your internet connection, or use CSV export instead.');
  const buf=await file.arrayBuffer();
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  let out='';
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    const items=content.items.map(it=>({str:it.str,x:it.transform[4],y:it.transform[5]})).filter(it=>it.str&&it.str.trim());
    items.sort((a,b)=>Math.abs(b.y-a.y)>3?b.y-a.y:a.x-b.x);
    let lines=[],curY=null,line=[];
    for(const it of items){
      if(curY===null||Math.abs(it.y-curY)<=3){line.push(it);if(curY===null)curY=it.y;}
      else{lines.push(line.sort((a,b)=>a.x-b.x).map(x=>x.str).join(' '));line=[it];curY=it.y;}
    }
    if(line.length)lines.push(line.sort((a,b)=>a.x-b.x).map(x=>x.str).join(' '));
    out+=lines.join('\n')+'\n';
  }
  return out;
}

// ── BANK PARSERS ───────────────────────────────────────────────────────────
function parseAMEX(text){
  // "MM/DD/YY DESCRIPTION $X.XX⧫?" one per line
  const rx=/^(\d{2}\/\d{2}\/\d{2})\s+(.+?)\s+(-?\$[\d,]+\.\d{2})\s*[⧫♦]?\s*$/gm;
  const results=[];let m;
  while((m=rx.exec(text))!==null){
    const p=m[1].split('/');
    const date=`20${p[2]}-${p[0]}-${p[1]}`;
    const amt=parseFloat(m[3].replace(/[$,]/g,''));
    if(!amt||isNaN(amt))continue;
    if(/mobile payment/i.test(m[2]))continue;
    results.push(makeTx(date,m[2],amt,'AMEX',amt<0));
  }
  return dedup(results);
}

function parseCapOne(text){
  // "Mar 19 Mar 20 DESCRIPTION $2,653.90" or "- $218.63" for payments
  const yr=text.match(/20\d{2}/)?.[0]||String(new Date().getFullYear());
  const rx=/(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+(\d{1,2})\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2}\s+(.+?)\s+(-\s*\$?[\d,]+\.\d{2}|\$[\d,]+\.\d{2})\s*$/gm;
  const results=[];let m;
  while((m=rx.exec(text))!==null){
    const date=`${yr}-${MO_MAP[m[1]]}-${m[2].padStart(2,'0')}`;
    const desc=m[3].trim();
    const amt=parseFloat(m[4].replace(/[\s$,]/g,''));
    if(!amt||isNaN(amt))continue;
    if(/mobile pymt|payment/i.test(desc))continue;
    results.push(makeTx(date,desc,Math.abs(amt),'Capital One',false));
  }
  return dedup(results);
}

function parseChase(text){
  // "MM/DD DESCRIPTION amount" — skip FX conversion lines
  const yr=text.match(/20\d{2}/)?.[0]||String(new Date().getFullYear());
  const skip=/hong kong dollar|pataca|euro|exchg rate|x 0\.\d{5}|^(total fees|total interest|payment thank|opening|closing|new balance|minimum|credit access|available|purchases|balance transfer|my chase|year-to-date|2[0-9]{3} totals)/i;
  const rx=/^(\d{2}\/\d{2})\s+(.+?)\s+(-?[\d,]+\.\d{2})\s*$/gm;
  const results=[];let m;
  while((m=rx.exec(text))!==null){
    if(skip.test(m[0])||skip.test(m[2]))continue;
    const[mo,dy]=m[1].split('/');
    const date=`${yr}-${mo}-${dy}`;
    const amt=parseFloat(m[3].replace(/,/g,''));
    if(!amt||isNaN(amt))continue;
    if(/payment thank/i.test(m[2]))continue;
    results.push(makeTx(date,m[2].trim(),amt,'Chase',amt<0));
  }
  return dedup(results);
}

function parseOCBC(text){
  // DD/MM dates (day first!), credits in parentheses e.g. (542.42)
  const ym=text.match(/(\d{2})[-\/](\d{2})[-\/](20\d{2})/);
  const yr=ym?ym[3]:String(new Date().getFullYear());
  const rx=/^(\d{2})\/(\d{2})\s+(.+?)\s+(\([\d,]+\.\d{2}\)|[\d,]+\.\d{2})\s*$/gm;
  const results=[];let m;
  while((m=rx.exec(text))!==null){
    const[,dd,mm,desc,amts]=m;
    if(/last month|subtotal|total amount|minimum|credit limit|available credit|payment due|statement date|^for:/i.test(desc))continue;
    const date=`${yr}-${mm}-${dd}`;
    const isCredit=amts.startsWith('(')||/payment|reversal/i.test(desc);
    const amt=parseFloat(amts.replace(/[(),]/g,''));
    if(!amt||isNaN(amt))continue;
    results.push(makeTx(date,desc,isCredit?-amt:amt,'OCBC',isCredit));
  }
  return dedup(results);
}

async function parsePDF(file){
  const text=await pdfToText(file);
  if(!text||text.trim().length<50)throw new Error(`Could not read text from "${file.name}". It may be a scanned PDF — please use CSV export.`);
  const fn=file.name.toLowerCase();
  // Detect bank from content + filename
  if(/american express|platinum card/i.test(text)||/amex|mar_28/i.test(fn))return{txns:parseAMEX(text),card:'AMEX'};
  if(/capital one|venture credit card/i.test(text)||/venture|capital/i.test(fn))return{txns:parseCapOne(text),card:'Capital One'};
  if(/chase sapphire|sapphire preferred/i.test(text)||/statements-6661/i.test(fn))return{txns:parseChase(text),card:'Chase'};
  if(/ocbc|oversea-chinese banking/i.test(text)||/ocbc/i.test(fn))return{txns:parseOCBC(text),card:'OCBC'};
  if(/jpmorgan chase.*checking|chase total checking/i.test(text))return{txns:parseChase(text),card:'Chase'};
  // Try AMEX format as fallback — it works for uncompressed PDFs
  const fallback=parseAMEX(text);
  return{txns:fallback,card:'Unknown'};
}

// ── CSV PARSER ─────────────────────────────────────────────────────────────
function parseCSVRows(text){
  return text.trim().split(/\r?\n/).map(r=>{
    const out=[];let cur='',inq=false;
    for(const ch of r){if(ch==='"'){inq=!inq}else if(ch===','&&!inq){out.push(cur.trim());cur=''}else cur+=ch}
    out.push(cur.trim());return out;
  });
}
function detectCSVCard(fname,hdr){
  const fn=fname.toLowerCase(),h=hdr.join(',').toLowerCase();
  if(/amex|american.express/.test(fn))return'AMEX';
  if(/chase/.test(fn))return'Chase';
  if(/capital.one|capitalone/.test(fn))return'Capital One';
  if(/ocbc/.test(fn))return'OCBC';
  if(/card member|account #/.test(h))return'AMEX';
  if(/transaction date.*post date.*type/.test(h))return'Chase';
  if(/transaction date.*posted date.*debit/.test(h))return'Capital One';
  if(hdr.length===3&&h.includes('date')&&h.includes('description')&&h.includes('amount'))return'AMEX';
  return'AMEX';
}
function parseCSV(text,fname){
  const rows=parseCSVRows(text);if(rows.length<2)return[];
  const hdr=rows[0].map(h=>h.replace(/^"|"$/g,'').toLowerCase().trim());
  const card=detectCSVCard(fname,hdr);
  const gi=ns=>{for(const n of ns){const i=hdr.findIndex(h=>h.includes(n));if(i>=0)return i;}return -1;};
  const di=gi(['date']),dsi=gi(['description','merchant','payee']),ai=gi(['amount','debit']),ci=gi(['credit']);
  const results=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i].map(c=>c.replace(/^"|"$/g,'').trim());
    if(!r[di]||!r[dsi])continue;
    const d=nd(r[di]);if(!d)continue;
    let amt=0;
    if(card==='Capital One'){
      const deb=parseFloat((r[ai]||'0').replace(/[^0-9.]/g,''))||0;
      const cred=parseFloat(((ci>=0?r[ci]:'')||'0').replace(/[^0-9.]/g,''))||0;
      amt=deb>0?deb:cred>0?-cred:0;
    }else{amt=parseFloat((r[ai]||'0').replace(/[^0-9.\-]/g,''))||0;}
    if(!amt)continue;
    const desc=r[dsi];const isCredit=amt<0;
    results.push({id:uid(),date:d,expenseDate:d,desc,amount:amt,card,
      category:isCredit?'Transfers & Payments':categorize(desc),trip:'',moved:false,isCredit});
  }
  return results;
}

function setStatus(msg,type='load'){
  const el=document.getElementById('status');
  if(!msg){el.style.display='none';return;}
  el.className=`s-${type}`;el.textContent=msg;el.style.display='block';

// ── FILE HANDLING ──────────────────────────────────────────────────────────
async function handleFiles(files,type){
  setStatus(null);
  for(const f of Array.from(files)){
    const isPDF=f.name.toLowerCase().endsWith('.pdf')||type==='pdf';
    setStatus(`Reading ${f.name}…`);
    try{
      let parsed=[],card='Unknown';
      if(isPDF){
        const r=await parsePDF(f);parsed=r.txns;card=r.card;
        if(!parsed.length){
          const fid=logFile(f,0,card,'needs review');
          setStatus(`No transactions found in "${f.name}". Try the CSV export instead.`,'err');
          continue;
        }
      }else{
        const text=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsText(f);});
        parsed=parseCSV(text,f.name);
        card=parsed[0]?.card||'CSV';
      }
      if(!parsed.length){setStatus(`No transactions found in "${f.name}".`,'err');continue;}
      const fid=logFile(f,parsed.length,card,'imported');
      parsed.forEach(t=>t.fileId=fid);
      txns=[...txns,...parsed].sort((a,b)=>b.expenseDate.localeCompare(a.expenseDate));
      const matched=parsed.filter(t=>t.category!=='Uncategorized').length;
      setStatus(`✓ ${f.name} — ${parsed.length} transactions, ${Math.round(matched/parsed.length*100)}% auto-categorized`,'ok');
      setTimeout(()=>setStatus(null),5000);
    }catch(e){
      logFile(f,0,'Unknown','failed');
      setStatus(e.message,'err');
    }
  }
  refresh();
}
function drop(e,type){
  e.preventDefault();
  document.getElementById(type==='pdf'?'fi-pdf':'fi-csv').closest('.upbox').classList.remove('drag');
  handleFiles(e.dataTransfer.files,type);
}

function logFile(file,count,card,status){
  const id=uid();
  const dt=new Date().toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
  uploadedFiles.unshift({id,name:file.name,count,card,status,dt});
  return id;
}
function renderFileLog(){
  const el=document.getElementById('file-log');
  if(!uploadedFiles.length){el.innerHTML='<div class="fempty">No files uploaded yet.</div>';return;}
  el.innerHTML=uploadedFiles.map(f=>`
    <div class="frow">
      <div><div class="fname">${f.name}</div><div class="fmeta">${f.dt} · ${f.card}</div></div>
      <div class="fstat ${f.status==='failed'?'fail':''}">${f.status}</div>
      <div class="fmeta">${f.count} txns</div>
      <button class="sbtn danger" onclick="removeFile('${f.id}')">Remove</button>
    </div>`).join('');
}
function removeFile(id){
  const f=uploadedFiles.find(x=>x.id===id);
  if(!f||!confirm(`Remove all transactions from "${f.name}"?`))return;
  txns=txns.filter(t=>t.fileId!==id);
  uploadedFiles=uploadedFiles.filter(x=>x.id!==id);
  refresh();
}

function genMonths(){
  const r=[],now=new Date();
  for(let i=-6;i<=6;i++){const d=new Date(now.getFullYear(),now.getMonth()+i,1);r.push(d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0'));}
  return r;
}

// ── SAVE / LOAD ─────────────────────────────────────────────────────────────
function save(){

    const el=document.getElementById('save-pill');
    if(el)el.textContent='saved '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  }catch(e){}
}
function load(){
  try{
    const raw=localStorage.getItem(SK);if(!raw)return;
    const d=JSON.parse(raw);
    txns=Array.isArray(d.txns)?d.txns:[];
    uploadedFiles=Array.isArray(d.uploadedFiles)?d.uploadedFiles:[];

    txns.forEach(t=>{if(!('trip' in t))t.trip='';});

}
function exportBackup(){
  const blob=new Blob([JSON.stringify({txns,uploadedFiles,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='expense-ledger-backup.json';a.click();

function importBackup(files){

function exportCSV(){
  if(!txns.length){alert('No transactions');return;}
  const yr=[...new Set(txns.map(t=>t.expenseDate.slice(0,4)))].sort().reverse()[0];
  const esc=v=>'"'+String(v).replace(/"/g,'""')+'"',row=arr=>arr.map(esc).join(',');
  const txRows=[row(['Date','Expense Date','Description','Card','Category','Trip','Amount','Credit?','Moved?']),
    ...txns.map(t=>row([t.date,t.expenseDate,t.desc,t.card,t.category,t.trip||'',Math.abs(t.amount).toFixed(2),t.isCredit?'Yes':'No',t.moved?'Yes':'No']))].join('\n');
  const spend=txns.filter(t=>!t.isCredit&&t.category!=='Transfers & Payments');
  const byCat={};spend.forEach(t=>{byCat[t.category]=(byCat[t.category]||0)+t.amount;});
  const total=Object.values(byCat).reduce((a,b)=>a+b,0);
  const sumRows=[row(['']),row([`SUMMARY — ${yr}`]),row(['Category','Total','%']),
    ...Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,a])=>row([c,a.toFixed(2),(a/total*100).toFixed(1)+'%'])),
    row(['']),row(['TOTAL',total.toFixed(2),'100%'])].join('\n');
  const blob=new Blob([txRows+'\n\n'+sumRows],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`expenses_${yr}.csv`;a.click();
}

  // manual cat dropdown
  const mc=document.getElementById('m-cat');
  mc.innerHTML=CATS.map(c=>`<option value="${c}">${c}</option>`).join('');
}

function getFiltered(){
  const q=document.getElementById('f-search').value.toLowerCase();
  const cat=document.getElementById('f-cat').value;
  const mon=document.getElementById('f-month').value;
  const card=document.getElementById('f-card').value;
  const trip=document.getElementById('f-trip').value;
  const hc=document.getElementById('f-hc').checked;
  return txns.filter(t=>{
    if(hc&&t.isCredit)return false;
    if(q&&!t.desc.toLowerCase().includes(q)&&!t.category.toLowerCase().includes(q)&&!(t.trip||'').toLowerCase().includes(q))return false;
    if(cat&&t.category!==cat)return false;
    if(mon&&mk(t.expenseDate)!==mon)return false;
    if(card&&t.card!==card)return false;
    if(trip&&t.trip!==trip)return false;
    return true;
  });
}

function catOpts(cur){return CATS.map(c=>`<option value="${c}"${c===cur?' selected':''}>${ce(c)} ${c}</option>`).join('');}
function tripOpts(cur){
  const trips=getTrips();
  return`<option value="">—</option>`+trips.map(tr=>`<option value="${tr}"${tr===cur?' selected':''}>${tr}</option>`).join('')+`<option value="__new__">+ New…</option>`;
}

function renderTx(){
  const el=document.getElementById('tx-list');
  if(!txns.length){el.innerHTML=`<div class="empty"><div class="eb">No transactions yet</div><div>Upload a PDF or CSV statement above</div></div>`;return;}
  const filtered=getFiltered();
  const uc=filtered.filter(t=>t.category==='Uncategorized').length;
  const banner=uc?`<div class="banner">${uc} uncategorized — fix with dropdown</div>`:'';
  if(!filtered.length){el.innerHTML=banner+`<div class="empty"><div class="eb">No matches</div><div>Adjust your filters</div></div>`;return;}
  const rows=filtered.map(t=>`<tr>
    <td class="dc">${fd(t.expenseDate)}${t.moved?'<span class="dtag">↳ moved</span>':''}</td>
    <td class="desc-c" title="${t.desc.replace(/"/g,'&quot;')}">${t.desc}</td>
    <td style="font-size:10px;white-space:nowrap;color:${CARD_C[t.card]||'var(--muted)'}">${t.card}</td>
    <td><div class="ci"><span class="dot" style="background:${cc(t.category)}"></span>
      <select class="csel${t.category==='Uncategorized'?' unc':''}" onchange="setCat('${t.id}',this.value)">${catOpts(t.category)}</select>
    </div></td>
    <td>
      <select class="tsel" onchange="handleTripSel('${t.id}',this.value)">${tripOpts(t.trip||'')}</select>
    </td>
    <td class="amt ${t.isCredit?'cred':'exp'}">${t.isCredit?'−':''}${fm(Math.abs(t.amount))}</td>
    <td><button class="ibtn" onclick="openMoveModal('${t.id}')">move</button></td>
    <td><button class="dbtn" onclick="delTx('${t.id}')" title="Delete">×</button></td>
  </tr>`).join('');
  el.innerHTML=banner+`<div class="tx-wrap"><table>
    <thead><tr><th>Date</th><th>Description</th><th>Card</th><th>Category</th><th>Trip</th><th style="text-align:right">Amount</th><th></th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function handleTripSel(id,val){
  if(val==='__new__'){
    const name=prompt('Trip name (e.g. "Yellowstone 2026"):');
    if(!name)return;
    setTrip(id,name.trim());
  }else{setTrip(id,val);}
}

function renderMonthly(){
  const bm={};
  txns.filter(t=>!t.isCredit&&t.category!=='Transfers & Payments').forEach(t=>{
    const k=mk(t.expenseDate);if(!bm[k])bm[k]={total:0,cats:{}};
    bm[k].total+=t.amount;bm[k].cats[t.category]=(bm[k].cats[t.category]||0)+t.amount;
  });
  const keys=Object.keys(bm).sort().reverse();
  const el=document.getElementById('tab-mo');
  if(!keys.length){el.innerHTML='<div class="empty"><div class="eb">No data yet</div></div>';return;}
  el.innerHTML=keys.map(k=>{
    const m=bm[k],max=Math.max(...Object.values(m.cats),1);
    return`<div class="mcard">
      <div class="mhdr" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
        <span class="mtitle">${ml(k)}</span><span class="mtotal">${fm(m.total)}</span>
      </div>
      <div class="mbody">${Object.entries(m.cats).sort((a,b)=>b[1]-a[1]).map(([c,a])=>`
        <div class="crow">
          <span class="dot" style="background:${cc(c)}"></span>
          <span class="cname">${ce(c)} ${c}</span>
          <div class="bwrap"><div class="bar" style="width:${Math.round(a/max*100)}%;background:${cc(c)}"></div></div>
          <span class="cpct">${pct(a,m.total)}%</span>
          <span class="camt">${fm(a)}</span>
        </div>`).join('')}</div>
    </div>`;
  }).join('');
}

function renderYearly(){
  const by={};
  txns.filter(t=>!t.isCredit&&t.category!=='Transfers & Payments').forEach(t=>{
    const y=t.expenseDate.slice(0,4);if(!by[y])by[y]={total:0,mos:{},cats:{}};
    by[y].total+=t.amount;const k=mk(t.expenseDate);
    by[y].mos[k]=(by[y].mos[k]||0)+t.amount;by[y].cats[t.category]=(by[y].cats[t.category]||0)+t.amount;
  });
  const years=Object.keys(by).sort().reverse();
  const el=document.getElementById('tab-yr');
  if(!years.length){el.innerHTML='<div class="empty"><div class="eb">No data yet</div></div>';return;}
  const y=years[0],d=by[y],maxM=Math.max(...Object.values(d.mos),1),maxC=Math.max(...Object.values(d.cats),1);
  const numMos=Object.keys(d.mos).length||1;
  const topCat=Object.entries(d.cats).sort((a,b)=>b[1]-a[1])[0];
  el.innerHTML=`
    <div class="yr-hero">
      <div class="ycard"><div class="lbl">${y} Total Spend</div><div class="val gold">${fm(d.total)}</div></div>
      <div class="ycard"><div class="lbl">Monthly Average</div><div class="val" style="font-size:18px">${fm(d.total/numMos)}</div></div>
      <div class="ycard"><div class="lbl">Biggest Category</div>
        <div style="font-size:13px;margin-top:4px">${topCat?ce(topCat[0])+' '+topCat[0]:'—'}</div>
        ${topCat?`<div style="font-size:11px;color:var(--muted);margin-top:3px">${fm(topCat[1])} · ${pct(topCat[1],d.total)}%</div>`:''}
      </div>
    </div>
    <div class="mgrid">${MOS.map((_,i)=>{const k=y+'-'+(i+1).toString().padStart(2,'0'),v=d.mos[k]||0;
      return`<div class="mcell"><div class="ml">${MOS[i]}</div><div class="mv" style="color:${v?'var(--text)':'var(--border)'}">${v?fm(v):'—'}</div>${v?`<div class="bwrap" style="margin-top:5px"><div class="bar" style="width:${Math.round(v/maxM*100)}%;background:var(--accent)"></div></div>`:''}</div>`;
    }).join('')}</div>
    <div class="yrcats"><h3>By category — ${y}</h3>${Object.entries(d.cats).sort((a,b)=>b[1]-a[1]).map(([c,a])=>`
      <div class="ycrow">
        <span class="dot" style="background:${cc(c)}"></span>
        <span class="ycname">${ce(c)} ${c}</span>
        <div class="ybwrap"><div class="ybar" style="width:${Math.round(a/maxC*100)}%;background:${cc(c)}"></div></div>
        <span class="ypct">${pct(a,d.total)}%</span>
        <span class="yamt">${fm(a)}</span>
      </div>`).join('')}</div>`;
}

function renderTrips(){
  const el=document.getElementById('tab-tr');
  const trips=getTrips();
  if(!trips.length){
    el.innerHTML=`<div class="no-trips"><div class="nb">No trips yet</div><div>Tag transactions using the Trip column in the Transactions tab, or via the "Tag trip" button</div></div>`;
    return;
  }
  el.innerHTML='<div class="trips-grid">'+trips.map(trip=>{
    const tTxns=txns.filter(t=>t.trip===trip&&!t.isCredit&&t.category!=='Transfers & Payments');
    const total=tTxns.reduce((s,t)=>s+t.amount,0);
    const dates=tTxns.map(t=>t.expenseDate).sort();
    const dateRange=dates.length?`${fd(dates[0])}${dates[0]!==dates[dates.length-1]?' → '+fd(dates[dates.length-1]):''}`:'-';
    const byCat={};tTxns.forEach(t=>{byCat[t.category]=(byCat[t.category]||0)+t.amount;});
    const maxC=Math.max(...Object.values(byCat),1);
    return`<div class="tcard">
      <div class="tcard-hdr">
        <div>
          <div class="tcard-name">📍 ${trip}</div>
          <div class="tcard-meta">${dateRange} · ${tTxns.length} transactions</div>
        </div>
        <div class="tcard-total">${fm(total)}</div>
      </div>
      <div class="tcard-body">${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,a])=>`
        <div class="ycrow">
          <span class="dot" style="background:${cc(c)}"></span>
          <span class="ycname">${ce(c)} ${c}</span>
          <div class="ybwrap"><div class="ybar" style="width:${Math.round(a/maxC*100)}%;background:${cc(c)}"></div></div>
          <span class="ypct">${pct(a,total)}%</span>
          <span class="yamt">${fm(a)}</span>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('')+'</div>';
}

function showTab(t){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('on',['tx','mo','yr','tr'][i]===t));
  ['tx','mo','yr','tr'].forEach(n=>document.getElementById('tab-'+n).style.display=n===t?'block':'none');
}

// Export CSV button in header
document.querySelector('#hdr-stats').insertAdjacentHTML('afterend','');
// Add export button to tabs bar
document.getElementById('tabs').insertAdjacentHTML('beforeend','<button class="tab" style="margin-left:auto;color:var(--green)" onclick="exportCSV()">↓ CSV</button>');

load();refresh();
</script>
</body>
</html>
