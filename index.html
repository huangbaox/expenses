<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expense Ledger</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f0d;--surface:#1a1a16;--surface2:#222219;--border:#2e2e26;
  --text:#e8e6dc;--muted:#7a7868;--accent:#c8b26a;--green:#7a9e7e;--red:#c26a5a;
  --font:DM Mono,Consolas,Monaco,monospace;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;min-height:100vh}
a{color:var(--accent);text-decoration:none}
#app{max-width:1100px;margin:0 auto;padding:24px 20px}
#header{display:flex;align-items:baseline;gap:14px;margin-bottom:20px;flex-wrap:wrap}
#header h1{font-size:22px;font-weight:400;color:var(--accent)}
.sub{font-size:11px;color:var(--muted)}
#stat-bar{display:flex;gap:20px;margin-left:auto;align-items:baseline;flex-wrap:wrap}
.stat{font-size:11px;color:var(--muted)}
.stat span{color:var(--text);font-size:13px}
#tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.tab-btn{padding:7px 16px;border-radius:4px;cursor:pointer;font-family:var(--font);font-size:12px;border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:all .15s}
.tab-btn.active{background:var(--accent);color:#0f0f0d;border-color:var(--accent);font-weight:700}
.tab-btn:hover:not(.active){color:var(--text)}
#export-btn{margin-left:auto;padding:7px 16px;border-radius:4px;cursor:pointer;font-family:var(--font);font-size:12px;border:1px solid var(--border);background:var(--surface);color:var(--green)}
#export-btn:hover{border-color:var(--green)}
#upload-zone{border:1px dashed var(--border);border-radius:8px;padding:28px;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:14px}
#upload-zone:hover,#upload-zone.drag{border-color:var(--accent)}
#upload-zone .big{font-size:15px;margin-bottom:6px}
#upload-zone .small{font-size:11px;color:var(--muted)}
#add-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:14px}
#add-row .field label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
#add-row input,#add-row select{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:12px;padding:5px 7px;border-radius:4px}
#add-btn{background:var(--accent);color:#0f0f0d;border:none;padding:6px 16px;border-radius:4px;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:700}
.banner{padding:8px 12px;border-radius:5px;margin-bottom:8px;font-size:11px}
.banner-red{background:rgba(194,106,90,.1);border:1px solid rgba(194,106,90,.3);color:var(--red)}
.tx-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
thead th{text-align:left;padding:6px 8px;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);border-bottom:1px solid var(--border);font-weight:400}
tbody tr{border-bottom:1px solid #161612}
tbody tr:hover td{background:#141410}
tbody td{padding:7px 8px;vertical-align:middle}
.date-cell{font-size:11px;color:var(--muted);white-space:nowrap}
.moved-tag{display:block;font-size:9px;color:var(--accent)}
.desc-cell{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-cell{font-size:10px;white-space:nowrap}
.cat-inner{display:flex;align-items:center;gap:5px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cat-select{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:11px;padding:3px 5px;border-radius:3px;max-width:210px;cursor:pointer}
.cat-select.uncat{border-color:rgba(194,106,90,.5);color:var(--red)}
.amt-cell{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt-cell.expense{color:var(--red)}
.amt-cell.credit{color:var(--green)}
.move-btn{background:none;border:1px solid var(--border);color:var(--muted);font-size:10px;padding:2px 7px;border-radius:3px;cursor:pointer;font-family:var(--font)}
.move-btn:hover{border-color:var(--accent);color:var(--accent)}
.del-btn{background:none;border:none;color:#2e2e26;cursor:pointer;font-size:16px;line-height:1;padding:0 3px}
.del-btn:hover{color:var(--red)}
.empty{text-align:center;padding:50px;color:var(--muted)}
.empty .em-big{font-size:16px;margin-bottom:8px;color:var(--text)}
.month-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;margin-bottom:12px;overflow:hidden}
.month-hdr{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.month-title{font-size:16px}.month-total{color:var(--accent);font-variant-numeric:tabular-nums;font-size:15px}
.month-body{padding:10px 16px}
.cat-row{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #111110}
.cat-row:last-child{border-bottom:none}
.cat-name{font-size:11px;color:var(--muted);width:210px;flex-shrink:0}
.bar-wrap{flex:1;height:4px;background:var(--border);border-radius:2px}
.bar{height:4px;border-radius:2px;opacity:.8;transition:width .4s}
.cat-pct{font-size:10px;color:var(--muted);width:34px;text-align:right;flex-shrink:0}
.cat-amt{font-size:12px;font-variant-numeric:tabular-nums;min-width:70px;text-align:right}
.yr-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.yr-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px 18px}
.yr-card .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.yr-card .val{font-size:24px;font-variant-numeric:tabular-nums}
.yr-card .val.gold{color:var(--accent)}
.month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.month-cell{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px 12px}
.month-cell .mc-lbl{font-size:10px;color:var(--muted);margin-bottom:3px}
.month-cell .mc-val{font-size:13px;font-variant-numeric:tabular-nums}
.yr-cats{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px}
.yr-cats h3{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:14px}
.ycat-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #111110}
.ycat-row:last-child{border-bottom:none}
.ycat-name{font-size:12px;width:210px;flex-shrink:0}
.ybar-wrap{flex:1;height:5px;background:var(--border);border-radius:2px}
.ybar{height:5px;border-radius:2px;opacity:.8}
.ypct{font-size:11px;color:var(--muted);width:38px;text-align:right;flex-shrink:0}
.yamt{font-size:13px;font-variant-numeric:tabular-nums;min-width:75px;text-align:right;font-weight:500}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;align-items:center;justify-content:center}
#modal.open{display:flex}
#modal-box{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px;min-width:290px}
#modal-box h3{font-size:14px;color:var(--accent);margin-bottom:6px}
#modal-desc{font-size:11px;color:var(--muted);margin-bottom:14px}
#modal-sel{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:13px;padding:7px;border-radius:4px;margin-bottom:16px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.btn-cancel{background:none;border:1px solid var(--border);color:var(--muted);padding:5px 14px;border-radius:4px;cursor:pointer;font-family:var(--font);font-size:12px}
.btn-confirm{background:var(--accent);border:none;color:#0f0f0d;padding:5px 16px;border-radius:4px;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:700}
.filter-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filter-row select,.filter-row input{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--font);font-size:12px;padding:5px 8px;border-radius:4px}
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <h1>Expense Ledger</h1>
    <div id="stat-bar">
      <div class="stat">transactions <span id="s-count">0</span></div>
      <div class="stat">matched <span id="s-matched" style="color:var(--green)">0%</span></div>
      <div class="stat">total spend <span id="s-total">—</span></div>
    </div>
  </div>
  <div id="tabs">
    <button class="tab-btn active" id="t-tx" onclick="showTab('tx')">Transactions</button>
    <button class="tab-btn" id="t-mo" onclick="showTab('mo')">Monthly</button>
    <button class="tab-btn" id="t-yr" onclick="showTab('yr')">Yearly</button>
    <button id="export-btn" onclick="exportCSV()">↓ Export CSV</button>
  </div>
  <div id="tab-tx">
    <div id="upload-zone" onclick="document.getElementById('fi').click()"
      ondragover="event.preventDefault();this.classList.add('drag')"
      ondragleave="this.classList.remove('drag')" ondrop="handleDrop(event)">
      <input id="fi" type="file" accept=".csv" multiple style="display:none" onchange="handleFiles(this.files)">
      <div class="big">Drop your AMEX CSV here or click to upload</div>
      <div class="small">Capital One · AMEX · Chase &nbsp;·&nbsp; tuned to your exact statement format</div>
    </div>
    <div id="add-row">
      <div class="field"><label>Date</label><input type="date" id="m-date"></div>
      <div class="field"><label>Description</label><input type="text" id="m-desc" placeholder="Merchant name" style="width:160px"></div>
      <div class="field"><label>Amount ($)</label><input type="number" id="m-amt" placeholder="0.00" step="0.01" style="width:88px"></div>
      <div class="field"><label>Card</label>
        <select id="m-card"><option>AMEX</option><option>Capital One</option><option>Chase</option><option>Manual</option></select>
      </div>
      <button id="add-btn" onclick="addManual()">+ Add</button>
    </div>
    <div class="filter-row">
      <input id="f-search" placeholder="Search..." oninput="renderTable()" style="width:160px">
      <select id="f-cat" onchange="renderTable()"><option value="">All categories</option></select>
      <select id="f-month" onchange="renderTable()"><option value="">All months</option></select>
      <label style="font-size:11px;color:var(--muted);margin-left:auto;display:flex;align-items:center;gap:6px">
        <input type="checkbox" id="f-hide-credits" onchange="renderTable()"> Hide credits/refunds
      </label>
    </div>
    <div id="tx-list"></div>
  </div>
  <div id="tab-mo" style="display:none"></div>
  <div id="tab-yr" style="display:none"></div>
</div>
<div id="modal">
  <div id="modal-box">
    <h3>Move to different month</h3>
    <div id="modal-desc"></div>
    <select id="modal-sel"></select>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-confirm" onclick="confirmMove()">Move</button>
    </div>
  </div>
</div>

<script>
const CATS=['Food & Drinks','Groceries','Fitness & Health','Shopping','Travel & Transport',
  'Entertainment & Subscriptions','Home & Utilities','Medical & Beauty',
  'Savings & Investments','Transfers & Payments','Fees & Interest','Uncategorized'];

const CAT_META={
  'Food & Drinks':                {emoji:'🍽️',color:'#c28e6a'},

  'Fitness & Health':             {emoji:'💪',color:'#7ac2a0'},
  'Shopping':                     {emoji:'🛍️',color:'#c2b86a'},
  'Travel & Transport':           {emoji:'✈️',color:'#6a8ec2'},
  'Entertainment & Subscriptions':{emoji:'🎬',color:'#9a7ac2'},
  'Home & Utilities':             {emoji:'🏠',color:'#8e9ec2'},
  'Medical & Beauty':             {emoji:'🏥',color:'#c27a8e'},
  'Savings & Investments':        {emoji:'💰',color:'#7ac28e'},
  'Transfers & Payments':         {emoji:'↔️',color:'#7a8e7a'},
  'Fees & Interest':              {emoji:'🏦',color:'#9a9a7a'},
  'Uncategorized':                {emoji:'❓',color:'#4a4a40'},

// ─────────────────────────────────────────────────────────────────────────────
// MERCHANT RULES — built directly from YOUR real AMEX statement data
// Format: each rule has a list of keyword substrings (lowercased) → category
// First match wins. Add new rules at the top of the relevant section.
// ─────────────────────────────────────────────────────────────────────────────
const RULES=[
  // ── SKIP: credits, refunds, payments (negative amounts handled in parser,
  //    but catch any that sneak through as positive with these keywords)

      'platinum resy','platinum saks credit','platinum credit'],c:'Transfers & Payments'},

  // ── TRANSFERS & PAYMENTS
  {k:['mobile payment','venmo','zelle','paypal','cash app','wire transfer',
      'bank transfer','account transfer'],c:'Transfers & Payments'},

  // ── FEES & INTEREST
  {k:['annual fee','late fee','interest charge','foreign transaction','atm fee',
      'finance charge','freetaxusa','allianztravel'],c:'Fees & Interest'},

  // ── TRAVEL — Airlines (exact AMEX format from your statements)
  {k:['american airlines','cathay pacific airwa','eva air corporation','singaporeair',
      'panasonic avionics','delta air','united air','jetblue','southwest air',
      'alaska air','spirit air','british airways','lufthansa','emirates',
      'air france','air canada','klm ','qantas','virgin atlantic'],c:'Travel & Transport'},

  // ── TRAVEL — Hotels (your statements show full hotel names)
  {k:['holiday inn','hotel eve pla','htl century s','yell old faith inn',
      'amex fine hotels','marriott','hilton','hyatt','westin','sheraton',
      'four seasons','ritz carlton','kimpton','loews hotel','best western',
      'hampton inn','doubletree','courtyard','airbnb','vrbo','booking.com'],c:'Travel & Transport'},

  // ── TRAVEL — Ground / Transit (your statements)
  // Grab (SE Asia ride-hailing) — always starts grab*
  {k:['grab*','grab '],c:'Travel & Transport'},
  // Ventra (Chicago transit), Pasmo/Suica (Japan transit), Singapore MRT
  {k:['ventra accoun','mobile pasmo','suica keitaik','aplpay bus/mrt','aplpay narita airpor',
      'aplpay klook travel'],c:'Travel & Transport'},
  // Uber — but NOT uber eats
  {k:['uber   *trip','uber trip'],c:'Travel & Transport'},
  {k:['uber eats','aplpay uber eats'],c:'Food & Drinks'},
  {k:['uber'],c:'Travel & Transport'},  // catch bare UBER after eats ruled out

  {k:['aplpay evolve st','aplpay hakuba highl','alpine valley','evergreen outdoor'],c:'Travel & Transport'},

  // ── GROCERIES — tuned to your actual merchants

      'aplpay marianos','marianos','aplpay cold storage','aplpay h mart',

      'aplpay common man co'],c:'Groceries'},  // Common Man Coffee Roasters SG sells beans

  // ── FOOD & DRINKS ─────────────────────────────────────────────────────────

  {k:['tst*'],c:'Food & Drinks'},
  // Uber Eats / Deliveroo / Food Panda / GrabFood
  {k:['uber eats','aplpay deliveroo','aplpay food panda'],c:'Food & Drinks'},

  // Specific restaurants from your data
  {k:['aplpay saimai thai','saimai thai','tomori','aplpay pp*tomori',

      'aplpay ichiran','aplpay sushi kyotat','aplpay um yong baek',

      'aplpay weera thai','aplpay einstein bage','aplpay demachi hisay',

  // ── MEDICAL & BEAUTY — your specific merchants

  {k:['aplpay columbia bran'],c:'Shopping'},

  {k:['openai *chatgpt','openai'],c:'Entertainment & Subscriptions'},
  {k:['google *youtube','youtubepremi'],c:'Entertainment & Subscriptions'},
  {k:['apple.com/bill'],c:'Entertainment & Subscriptions'},
  {k:['netflix','hulu','disney+','disney plus','hbo max','spotify','amazon prime',
      'youtube premium','peacock','paramount+','apple tv','audible','kindle'],c:'Entertainment & Subscriptions'},

  // ── HOME & UTILITIES
  {k:['coned','con edison','verizon','at&t','t-mobile','comcast','xfinity',
      'spectrum','electric bill','gas bill','internet bill','phone bill',
      'rent payment','home depot','lowes'],c:'Home & Utilities'},

  // ── SAVINGS & INVESTMENTS

// ─────────────────────────────────────────────────────────────────────────────
const MOS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CARD_COLOR={'AMEX':'#6a8ec2','Capital One':'#c26a5a','Chase':'#7a9e7e','Manual':'#9e7a7e'};
const fm=n=>'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
const mk=d=>d?d.slice(0,7):'';
const ml=k=>{if(!k)return'';const[y,m]=k.split('-');return MOS[+m-1]+' '+y;};
const fd=d=>{if(!d)return'';const[y,m,day]=d.split('-');return MOS[+m-1]+' '+parseInt(day)+', '+y;};
const uid=()=>Math.random().toString(36).slice(2);
const meta=c=>CAT_META[c]||{emoji:'•',color:'#7a7868'};
const color=c=>meta(c).color;
const emoji=c=>meta(c).emoji;

function nd(s){
  if(!s)return null;s=s.trim();
  let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m)return`${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  return null;
}

// Core matching — check every rule against lowercased description
function categorize(desc){
  const d=desc.toLowerCase();
  for(const rule of RULES){
    for(const k of rule.k){
      if(d.includes(k))return rule.c;
    }
  }
  return 'Uncategorized';
}

let txns=[], moveId=null;

// ── CSV PARSING ──────────────────────────────────────────────────────────────
function parseCSVRows(text){
  return text.trim().split(/\r?\n/).map(r=>{
    const out=[];let cur='',inq=false;
    for(const ch of r){if(ch==='"'){inq=!inq}else if(ch===','&&!inq){out.push(cur.trim());cur=''}else cur+=ch}
    out.push(cur.trim());return out;
  });
}

function detectCard(fname,hdr){
  const fn=fname.toLowerCase();
  if(/amex|american.express/.test(fn))return'AMEX';
  if(/chase/.test(fn))return'Chase';
  if(/capital.one|capitalone/.test(fn))return'Capital One';
  const h=hdr.join(',').toLowerCase();
  if(/card member|account #|extended details/.test(h))return'AMEX';
  if(/transaction date.*post date.*type/.test(h))return'Chase';
  if(/transaction date.*posted date.*debit/.test(h))return'Capital One';
  // Your file: Date,Description,Amount — 3 columns, likely AMEX
  if(hdr.length===3&&h.includes('date')&&h.includes('description')&&h.includes('amount'))return'AMEX';
  return'AMEX'; // default to AMEX since that's your primary card
}

function parseTransactions(rows,card){
  const hdr=rows[0].map(h=>h.replace(/^"|"$/g,'').toLowerCase().trim());
  const get=ns=>{for(const n of ns){const i=hdr.findIndex(h=>h.includes(n));if(i>=0)return i;}return -1;};
  const di=get(['date']);
  const dsi=get(['description','merchant','payee']);
  const ai=get(['amount','debit']);
  const ci=get(['credit']);
  const results=[];
  for(let i=1;i<rows.length;i++){
    const r=rows[i].map(c=>c.replace(/^"|"$/g,'').trim());
    if(!r[di]||!r[dsi])continue;
    const d=nd(r[di]);if(!d)continue;
    let amt=parseFloat((r[ai]||'0').replace(/[^0-9.\-]/g,''))||0;
    // Skip credits/refunds/payments (negative = credit on AMEX)
    // but keep them as a record with negative flag
    const isCredit=amt<0;
    amt=Math.abs(amt);
    if(amt===0)continue;
    const desc=r[dsi];
    const cat=isCredit?'Transfers & Payments':categorize(desc);
    results.push({id:uid(),date:d,expenseDate:d,desc,amount:isCredit?-amt:amt,
      card,category:cat,moved:false,isCredit});
  }
  return results;
}

async function handleFiles(files){
  const newTxns=[];
  for(const f of Array.from(files)){
    const text=await new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsText(f);});
    const rows=parseCSVRows(text);
    if(rows.length<2)continue;
    const hdr=rows[0].map(h=>h.replace(/^"|"$/g,'').toLowerCase().trim());
    const card=detectCard(f.name,hdr);
    newTxns.push(...parseTransactions(rows,card));
  }
  if(!newTxns.length){alert('No transactions found');return;}
  txns=[...txns,...newTxns].sort((a,b)=>b.expenseDate.localeCompare(a.expenseDate));
  refresh();
}

function handleDrop(e){e.preventDefault();document.getElementById('upload-zone').classList.remove('drag');handleFiles(e.dataTransfer.files);}

function addManual(){
  const date=document.getElementById('m-date').value;
  const desc=document.getElementById('m-desc').value.trim();
  const amt=parseFloat(document.getElementById('m-amt').value)||0;
  const card=document.getElementById('m-card').value;
  if(!date||!desc||!amt){alert('Fill in date, description, and amount');return;}
  const t={id:uid(),date,expenseDate:date,desc,amount:amt,card,category:categorize(desc),moved:false,isCredit:false};
  txns.unshift(t);
  document.getElementById('m-desc').value='';document.getElementById('m-amt').value='';
  refresh();
}

function setCat(id,cat){const t=txns.find(x=>x.id===id);if(t){t.category=cat;refresh();}}
function delTx(id){txns=txns.filter(t=>t.id!==id);refresh();}
function openModal(id){
  moveId=id;const t=txns.find(x=>x.id===id);
  document.getElementById('modal-desc').textContent=`${t.desc} · ${fm(Math.abs(t.amount))}`;
  const keys=[...new Set([...txns.map(x=>mk(x.expenseDate)),...genMonths()])].sort().reverse();
  document.getElementById('modal-sel').innerHTML=keys.map(k=>`<option value="${k}"${k===mk(t.expenseDate)?' selected':''}>${ml(k)}</option>`).join('');
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');moveId=null;}
function confirmMove(){
  const t=txns.find(x=>x.id===moveId);
  if(t){t.expenseDate=document.getElementById('modal-sel').value+'-'+t.date.slice(8);t.moved=true;}
  closeModal();refresh();
}
function genMonths(){
  const r=[],now=new Date();
  for(let i=-6;i<=6;i++){const d=new Date(now.getFullYear(),now.getMonth()+i,1);r.push(d.getFullYear()+'-'+(d.getMonth()+1).toString().padStart(2,'0'));}
  return r;
}

function exportCSV(){
  if(!txns.length){alert('No transactions to export');return;}
  const year=[...new Set(txns.map(t=>t.expenseDate.slice(0,4)))].sort().reverse()[0];
  const esc=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const row=arr=>arr.map(esc).join(',');
  const spendOnly=txns.filter(t=>!t.isCredit&&t.category!=='Transfers & Payments');
  const txRows=[row(['Date (Statement)','Date (Expense)','Description','Card','Category','Amount ($)','Moved?']),
    ...txns.map(t=>row([t.date,t.expenseDate,t.desc,t.card,t.category,t.amount.toFixed(2),t.moved?'Yes':'No']))].join('\n');
  const byCat={};spendOnly.forEach(t=>{byCat[t.category]=(byCat[t.category]||0)+t.amount;});
  const total=Object.values(byCat).reduce((a,b)=>a+b,0);
  const sumRows=[row(['']),row([`YEARLY SUMMARY — ${year}`]),row(['Category','Total ($)','% of Spend']),
    ...Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([c,a])=>row([c,a.toFixed(2),(a/total*100).toFixed(1)+'%'])),
    row(['']),row(['TOTAL (excl. transfers)',total.toFixed(2),'100%'])].join('\n');
  const blob=new Blob([txRows+'\n\n'+sumRows],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`expenses_${year}.csv`;a.click();
}

function refresh(){
  const expenses=txns.filter(t=>!t.isCredit&&t.category!=='Transfers & Payments');
  const matched=txns.filter(t=>t.category!=='Uncategorized').length;
  const total=expenses.reduce((s,t)=>s+t.amount,0);
  document.getElementById('s-count').textContent=txns.length;
  document.getElementById('s-matched').textContent=txns.length?Math.round(matched/txns.length*100)+'%':'0%';
  document.getElementById('s-total').textContent=fm(total);
  populateFilters();
  renderTable();renderMonthly();renderYearly();
}

function populateFilters(){
  const catSel=document.getElementById('f-cat');
  const cur=catSel.value;
  catSel.innerHTML='<option value="">All categories</option>'+CATS.map(c=>`<option value="${c}"${c===cur?' selected':''}>${c}</option>`).join('');
  const monSel=document.getElementById('f-month');
  const curM=monSel.value;
  const months=[...new Set(txns.map(t=>mk(t.expenseDate)))].sort().reverse();
  monSel.innerHTML='<option value="">All months</option>'+months.map(k=>`<option value="${k}"${k===curM?' selected':''}>${ml(k)}</option>`).join('');
}

function getFiltered(){
  const q=document.getElementById('f-search').value.toLowerCase();
  const cat=document.getElementById('f-cat').value;
  const mon=document.getElementById('f-month').value;
  const hideCredits=document.getElementById('f-hide-credits').checked;
  return txns.filter(t=>{
    if(hideCredits&&t.isCredit)return false;
    if(q&&!t.desc.toLowerCase().includes(q)&&!t.category.toLowerCase().includes(q))return false;
    if(cat&&t.category!==cat)return false;
    if(mon&&mk(t.expenseDate)!==mon)return false;
    return true;
  });
}

function catSelectHTML(cur){return CATS.map(c=>`<option value="${c}"${c===cur?' selected':''}>${emoji(c)} ${c}</option>`).join('');}

function renderTable(){
  const el=document.getElementById('tx-list');
  if(!txns.length){el.innerHTML=`<div class="empty"><div class="em-big">No transactions yet</div><a href="#" onclick="loadDemo();return false">Load demo data →</a></div>`;return;}
  const filtered=getFiltered();
  const uc=filtered.filter(t=>t.category==='Uncategorized').length;
  const banner=uc>0?`<div class="banner banner-red">${uc} transaction${uc>1?'s':''} couldn't be matched — fix with the dropdown or <a href="#" onclick="alert('Email the merchant name to add it to the rules!')">report merchant</a></div>`:'';
  const rows=filtered.map(t=>{
    const isUc=t.category==='Uncategorized';
    const amtClass=t.isCredit?'credit':'expense';
    return`<tr>
      <td class="date-cell">${fd(t.expenseDate)}${t.moved?'<span class="moved-tag">↳ moved</span>':''}</td>
      <td class="desc-cell" title="${t.desc.replace(/"/g,'&quot;')}">${t.desc}</td>
      <td class="card-cell" style="color:${CARD_COLOR[t.card]||'var(--muted)'}">${t.card}</td>
      <td><div class="cat-inner">
        <span class="dot" style="background:${color(t.category)}"></span>
        <select class="cat-select${isUc?' uncat':''}" onchange="setCat('${t.id}',this.value)">${catSelectHTML(t.category)}</select>
      </div></td>
      <td class="amt-cell ${amtClass}">${t.isCredit?'−':''}${fm(Math.abs(t.amount))}</td>
      <td><button class="move-btn" onclick="openModal('${t.id}')">move</button></td>
      <td><button class="del-btn" onclick="delTx('${t.id}')" title="Delete">×</button></td>
    </tr>`;
  }).join('');
  el.innerHTML=banner+`<div class="tx-wrap"><table>
    <thead><tr><th>Date</th><th>Description</th><th>Card</th><th>Category</th><th style="text-align:right">Amount</th><th></th><th></th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function renderMonthly(){
  const bm={};
  txns.filter(t=>!t.isCredit&&t.category!=='Transfers & Payments').forEach(t=>{
    const k=mk(t.expenseDate);
    if(!bm[k])bm[k]={total:0,cats:{}};
    bm[k].total+=t.amount;
    bm[k].cats[t.category]=(bm[k].cats[t.category]||0)+t.amount;
  });
  const keys=Object.keys(bm).sort().reverse();
  const el=document.getElementById('tab-mo');
  if(!keys.length){el.innerHTML='<div class="empty"><div class="em-big">No data yet</div></div>';return;}
  el.innerHTML=keys.map(k=>{
    const m=bm[k],max=Math.max(...Object.values(m.cats),1);
    return`<div class="month-card">
      <div class="month-hdr" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
        <span class="month-title">${ml(k)}</span><span class="month-total">${fm(m.total)}</span>
      </div>
      <div class="month-body">${Object.entries(m.cats).sort((a,b)=>b[1]-a[1]).map(([c,a])=>`
        <div class="cat-row">
          <span class="dot" style="background:${color(c)}"></span>
          <span class="cat-name">${emoji(c)} ${c}</span>
          <div class="bar-wrap"><div class="bar" style="width:${Math.round(a/max*100)}%;background:${color(c)}"></div></div>
          <span class="cat-pct">${pct(a,m.total)}%</span>
          <span class="cat-amt">${fm(a)}</span>
        </div>`).join('')}</div>
    </div>`;
  }).join('');
}

function renderYearly(){
  const by={};
  txns.filter(t=>!t.isCredit&&t.category!=='Transfers & Payments').forEach(t=>{
    const y=t.expenseDate.slice(0,4);
    if(!by[y])by[y]={total:0,mos:{},cats:{}};
    by[y].total+=t.amount;
    const k=mk(t.expenseDate);
    by[y].mos[k]=(by[y].mos[k]||0)+t.amount;
    by[y].cats[t.category]=(by[y].cats[t.category]||0)+t.amount;
  });
  const years=Object.keys(by).sort().reverse();
  const el=document.getElementById('tab-yr');
  if(!years.length){el.innerHTML='<div class="empty"><div class="em-big">No data yet</div></div>';return;}
  const y=years[0],d=by[y];
  const maxM=Math.max(...Object.values(d.mos),1);
  const maxC=Math.max(...Object.values(d.cats),1);
  const numMos=Object.keys(d.mos).length||1;
  const topCat=Object.entries(d.cats).sort((a,b)=>b[1]-a[1])[0];
  el.innerHTML=`
    <div class="yr-hero">
      <div class="yr-card"><div class="lbl">${y} Total Spend</div><div class="val gold">${fm(d.total)}</div></div>
      <div class="yr-card"><div class="lbl">Monthly Average</div><div class="val" style="font-size:20px">${fm(d.total/numMos)}</div></div>
      <div class="yr-card"><div class="lbl">Biggest Category</div>
        <div style="font-size:14px;margin-top:4px">${topCat?emoji(topCat[0])+' '+topCat[0]:'—'}</div>
        ${topCat?`<div style="font-size:11px;color:var(--muted);margin-top:4px">${fm(topCat[1])} · ${pct(topCat[1],d.total)}% of spend</div>`:''}
      </div>
    </div>
    <div class="month-grid">${MOS.map((_,i)=>{const k=y+'-'+(i+1).toString().padStart(2,'0'),v=d.mos[k]||0;return`<div class="month-cell"><div class="mc-lbl">${MOS[i]}</div><div class="mc-val" style="color:${v?'var(--text)':'var(--border)'}">${v?fm(v):'—'}</div>${v?`<div class="bar-wrap" style="margin-top:6px"><div class="bar" style="width:${Math.round(v/maxM*100)}%;background:var(--accent)"></div></div>`:''}</div>`;}).join('')}</div>
    <div class="yr-cats"><h3>Spending by category — ${y}</h3>${Object.entries(d.cats).sort((a,b)=>b[1]-a[1]).map(([c,a])=>`
      <div class="ycat-row">
        <span class="dot" style="background:${color(c)}"></span>
        <span class="ycat-name">${emoji(c)} ${c}</span>
        <div class="ybar-wrap"><div class="ybar" style="width:${Math.round(a/maxC*100)}%;background:${color(c)}"></div></div>
        <span class="ypct">${pct(a,d.total)}%</span>
        <span class="yamt">${fm(a)}</span>
      </div>`).join('')}</div>`;
}

function showTab(t){
  ['tx','mo','yr'].forEach(n=>{document.getElementById('tab-'+n).style.display=n===t?'block':'none';document.getElementById('t-'+n).classList.toggle('active',n===t);});
  if(t==='mo')renderMonthly();if(t==='yr')renderYearly();
}
